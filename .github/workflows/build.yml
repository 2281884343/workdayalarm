name: Build exe

# 打 tag（如 v1.1.0）时自动打包单文件 exe 并上传到 Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装打包依赖
        run: python -m pip install --upgrade pip pyinstaller chinesecalendar

      - name: 打包
        run: python tools/build.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WorkdayAlarm-windows
          path: dist/WorkdayAlarm.exe

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WorkdayAlarm.exe
          generate_release_notes: true
