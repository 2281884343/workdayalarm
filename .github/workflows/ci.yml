name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只有重新生成/更新节假日数据时才需要这个包，运行时不需要
      - name: 安装开发依赖
        run: python -m pip install --upgrade pip chinesecalendar

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 冒烟检查（版本 / 工作日判定 / 环境自检）
        run: |
          python main.py --version
          python main.py --check --days 5
          python main.py --test
